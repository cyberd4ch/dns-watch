name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck bind9-dnsutils
      - name: shellcheck
        run: make shellcheck
      - name: offline test suite
        run: make test
